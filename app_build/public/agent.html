<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraTech - Support Console</title>
  <!-- Google Fonts Outfit and Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/agent.css">
</head>
<body>

  <div class="dashboard-container">
    
    <!-- Sidebar Panel -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="agent-profile">
          <div class="agent-avatar">A</div>
          <div>
            <h3>Agent Console</h3>
            <span class="agent-badge">Online</span>
          </div>
        </div>
        <div class="connection-status connected" id="wsStatus" title="Connected to server"></div>
      </div>

      <!-- Queue Status Lists -->
      <div class="sessions-nav">
        <!-- Queue list -->
        <div class="section-title">
          <span>Waiting in Queue</span>
          <span class="badge badge-queue" id="queueCount">0</span>
        </div>
        <div class="sessions-list" id="queueList">
          <!-- Dynamically filled -->
          <div class="empty-list-placeholder">No waiting customers</div>
        </div>

        <!-- Active Chats list -->
        <div class="section-title">
          <span>Active Conversations</span>
          <span class="badge badge-active" id="activeCount">0</span>
        </div>
        <div class="sessions-list" id="activeList">
          <!-- Dynamically filled -->
          <div class="empty-list-placeholder">No active chats</div>
        </div>

        <!-- Closed chats list -->
        <div class="section-title">
          <span>Closed Sessions</span>
          <span class="badge badge-closed" id="closedCount">0</span>
        </div>
        <div class="sessions-list" id="closedList">
          <!-- Dynamically filled -->
          <div class="empty-list-placeholder">No closed chats</div>
        </div>
      </div>
    </aside>

    <!-- Main Chat Workspace -->
    <main class="chat-workspace">
      <!-- Empty State View -->
      <div class="workspace-empty" id="workspaceEmpty">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <h2>No Active Session Selected</h2>
        <p>Choose a customer conversation from the sidebar queue to start chatting.</p>
      </div>

      <!-- Active Conversation Workspace -->
      <div class="workspace-active hidden" id="workspaceActive">
        <!-- Chat Header -->
        <header class="workspace-header">
          <div class="customer-meta">
            <h2 id="currentCustomerName">Customer Name</h2>
            <p id="currentCustomerEmail">customer@example.com</p>
          </div>
          <div class="workspace-actions">
            <button class="btn btn-claim hidden" id="claimChatBtn">Claim Conversation</button>
            <button class="btn btn-close" id="closeChatBtn">End Conversation</button>
          </div>
        </header>

        <!-- Message List Area -->
        <div class="conversation-pane">
          <div class="message-list" id="agentMessageList">
            <!-- Messages are loaded here dynamically -->
          </div>
          <div class="typing-indicator-wrapper hidden" id="customerTypingIndicator">
            <span class="typing-indicator-dots">
              <span></span><span></span><span></span>
            </span>
            <span class="typing-text">Customer is typing...</span>
          </div>
        </div>

        <!-- Chat Input & Canned replies footer -->
        <footer class="workspace-footer">
          <div class="footer-tools">
            <select class="canned-select" id="cannedSelect" aria-label="Insert quick response">
              <option value="" disabled selected>Select canned reply...</option>
              <option value="Hello! How can I help you today?">Greeting: How can I help?</option>
              <option value="Let me look into that for you. One moment, please.">Hold: Checking records</option>
              <option value="I have processed that request for you. Is there anything else I can help you with?">Action: Processing request done</option>
              <option value="Thank you for reaching out to AuraTech. Have a great day!">Closing: Thanks, have a great day</option>
            </select>
          </div>
          <form class="message-input-form" id="agentMessageForm">
            <input type="text" id="agentMessageInput" placeholder="Type your message..." autocomplete="off" required>
            <button type="submit" class="btn-send" aria-label="Send message">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </form>
        </footer>
      </div>
    </main>
  </div>

  <!-- Audio notify element for queue events -->
  <audio id="alertSound" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==\"></audio>

  <!-- Scripts -->
  <script src="js/agent.js"></script>
</body>
</html>
