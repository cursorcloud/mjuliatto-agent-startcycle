<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraTech - iPhone Icon Tic-Tac-Toe</title>
  <!-- Google Fonts Outfit and Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tictactoe.css">
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- Global SVG definitions for gradients (fixes browser gradient rendering when SVG is cloned from hidden container) -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
    <defs>
      <!-- Safari Gradients -->
      <linearGradient id="safari-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
        <stop stop-color="#0A84FF"/>
        <stop offset="1" stop-color="#0066CC"/>
      </linearGradient>
      <linearGradient id="safari-inner-bg" x1="11" y1="11" x2="53" y2="53" gradientUnits="userSpaceOnUse">
        <stop stop-color="#34C759"/>
        <stop offset="0.5" stop-color="#007AFF"/>
        <stop offset="1" stop-color="#5856D6"/>
      </linearGradient>
      <!-- App Store Gradient -->
      <linearGradient id="appstore-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
        <stop stop-color="#34AADC"/>
        <stop offset="1" stop-color="#007AFF"/>
      </linearGradient>
      <!-- Messages Gradient -->
      <linearGradient id="messages-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
        <stop stop-color="#4CD964"/>
        <stop offset="1" stop-color="#28CD41"/>
      </linearGradient>
      <!-- Phone Gradient -->
      <linearGradient id="phone-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
        <stop stop-color="#4CD964"/>
        <stop offset="1" stop-color="#28CD41"/>
      </linearGradient>
      <!-- Mail Gradients -->
      <linearGradient id="mail-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
        <stop stop-color="#5AC8FA"/>
        <stop offset="1" stop-color="#007AFF"/>
      </linearGradient>
      <linearGradient id="mail-accent" x1="14" y1="22" x2="50" y2="33" gradientUnits="userSpaceOnUse">
        <stop stop-color="#8E8E93"/>
        <stop offset="1" stop-color="#AEAEB2"/>
      </linearGradient>
      <!-- Camera Gradient -->
      <linearGradient id="camera-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
        <stop stop-color="#E5E5EA"/>
        <stop offset="1" stop-color="#AEAEB2"/>
      </linearGradient>
      <!-- Settings Gradient -->
      <linearGradient id="settings-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
        <stop stop-color="#8E8E93"/>
        <stop offset="1" stop-color="#3A3A3C"/>
      </linearGradient>
      <!-- Music Gradient -->
      <linearGradient id="music-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
        <stop stop-color="#FF2D55"/>
        <stop offset="1" stop-color="#FF375F"/>
      </linearGradient>
      <!-- Maps Gradients -->
      <linearGradient id="maps-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
        <stop stop-color="#30D158"/>
        <stop offset="0.6" stop-color="#00A2FF"/>
        <stop offset="1" stop-color="#5856D6"/>
      </linearGradient>
      <linearGradient id="maps-routes" x1="10" y1="32" x2="54" y2="32" gradientUnits="userSpaceOnUse">
        <stop stop-color="#FFD60A"/>
        <stop offset="1" stop-color="#FF9500"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- Header Section with Nav -->
  <header class="main-header">
    <div class="header-container">
      <div class="logo" style="cursor: pointer;" onclick="window.location.href='index.html'">
        <span class="logo-dot"></span>
        <span class="logo-text">AuraTech</span>
      </div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#products">Products</a>
        <a href="tictactoe.html" class="nav-tictactoe-link active">Tic-Tac-Toe</a>
        <a href="agent.html" target="_blank" class="nav-agent-link">Agent Dashboard</a>
      </nav>
    </div>
  </header>

  <!-- Main Container -->
  <main class="game-container">
    <div class="game-card">
      <h1 class="game-title">iOS Tic-Tac-Toe</h1>
      <p class="game-subtitle">A premium Apple-themed spin on the classic game</p>

      <!-- SETUP SCREEN -->
      <section id="setupScreen" class="setup-screen">
        <div class="player-setup-row">
          <!-- Player 1 Config -->
          <div class="player-box" id="player1Box">
            <h3 class="player-title p1-color">Player 1 (O)</h3>
            <input type="text" id="player1Name" class="player-name-input" value="Player 1" placeholder="Enter Name">
            <p class="select-hint">Choose your iPhone Icon:</p>
            <div class="icon-gallery" id="galleryP1">
              <!-- Rendered via JS -->
            </div>
            <div class="selected-icon-preview" id="p1Preview">
              <span class="no-selection">None selected</span>
            </div>
          </div>

          <!-- Player 2 Config -->
          <div class="player-box" id="player2Box">
            <h3 class="player-title p2-color">Player 2 (X)</h3>
            <input type="text" id="player2Name" class="player-name-input" value="Player 2" placeholder="Enter Name">
            <p class="select-hint">Choose your iPhone Icon:</p>
            <div class="icon-gallery" id="galleryP2">
              <!-- Rendered via JS -->
            </div>
            <div class="selected-icon-preview" id="p2Preview">
              <span class="no-selection">None selected</span>
            </div>
          </div>
        </div>

        <button id="startGameBtn" class="btn btn-primary start-btn" disabled>Start Match</button>
      </section>

      <!-- GAME SCREEN -->
      <section id="gameScreen" class="game-screen hidden">
        <!-- Status Bar -->
        <div class="status-bar">
          <div class="player-indicator p1-indicator active" id="p1Indicator">
            <div class="indicator-icon" id="p1IndicatorIcon"></div>
            <span class="indicator-name" id="p1IndicatorName">Player 1</span>
          </div>
          <div class="vs-divider">VS</div>
          <div class="player-indicator p2-indicator" id="p2Indicator">
            <div class="indicator-icon" id="p2IndicatorIcon"></div>
            <span class="indicator-name" id="p2IndicatorName">Player 2</span>
          </div>
        </div>

        <div class="turn-announcement" id="turnAnnouncement">
          It's Player 1's turn!
        </div>

        <!-- Tic Tac Toe Board -->
        <div class="board" id="board">
          <button class="cell" data-index="0" aria-label="Cell 1"></button>
          <button class="cell" data-index="1" aria-label="Cell 2"></button>
          <button class="cell" data-index="2" aria-label="Cell 3"></button>
          <button class="cell" data-index="3" aria-label="Cell 4"></button>
          <button class="cell" data-index="4" aria-label="Cell 5"></button>
          <button class="cell" data-index="5" aria-label="Cell 6"></button>
          <button class="cell" data-index="6" aria-label="Cell 7"></button>
          <button class="cell" data-index="7" aria-label="Cell 8"></button>
          <button class="cell" data-index="8" aria-label="Cell 9"></button>
        </div>

        <!-- Controls -->
        <div class="game-controls">
          <button id="resetGameBtn" class="btn btn-primary">Play Again</button>
          <button id="backToSetupBtn" class="btn btn-secondary">Change Icons</button>
        </div>
      </section>
    </div>
  </main>

  <!-- Reusable SVG Templates Container (Hidden) -->
  <div style="display: none;">
    <!-- Safari -->
    <svg id="svg-safari" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="64" height="64" rx="14" fill="url(#safari-bg)"/>
      <circle cx="32" cy="32" r="24" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="21" fill="url(#safari-inner-bg)"/>
      <!-- Compass markings -->
      <line x1="32" y1="14" x2="32" y2="18" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="32" y1="46" x2="32" y2="50" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="14" y1="32" x2="18" y2="32" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="46" y1="32" x2="50" y2="32" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Compass dial needle -->
      <polygon points="32,32 37,21 32,15 27,21" fill="#FF3B30"/>
      <polygon points="32,32 37,43 32,49 27,43" fill="#FFFFFF"/>
      <circle cx="32" cy="32" r="2" fill="#FFFFFF"/>
    </svg>

    <!-- App Store -->
    <svg id="svg-appstore" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="64" height="64" rx="14" fill="url(#appstore-bg)"/>
      <!-- A-shape rods -->
      <path d="M19 44L32 20L45 44" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24 37H40" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    </svg>

    <!-- Messages -->
    <svg id="svg-messages" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="64" height="64" rx="14" fill="url(#messages-bg)"/>
      <path fill-rule="evenodd" clip-rule="evenodd" d="M14 31C14 21.0589 22.0589 13 32 13C41.9411 13 50 21.0589 50 31C50 40.9411 41.9411 49 32 49C29.1718 49 26.4947 48.3475 24.1166 47.1852L15.3526 50.3721C14.7738 50.5826 14.1685 50.1163 14.2372 49.5028L15.2818 40.1611C14.4607 37.4042 14 34.4755 14 31Z" fill="#FFFFFF"/>
    </svg>

    <!-- Phone -->
    <svg id="svg-phone" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="64" height="64" rx="14" fill="url(#phone-bg)"/>
      <path d="M42.45 44.5C38.2 44.5 30.5 41.9 23.4 34.8C16.3 27.7 13.7 20 13.7 15.75C13.7 14.1 14.9 12.8 16.55 12.8H21.5C22.35 12.8 23.05 13.4 23.2 14.2L24.75 21.4C24.85 22.05 24.6 22.75 24.1 23.25L20.65 26.7C22.25 30.45 25.35 33.55 29.1 35.15L32.55 31.7C33.05 31.2 33.75 30.95 34.4 31.05L41.6 32.6C42.4 32.75 43 33.45 43 34.3V39.25C43.05 40.9 44.1 44.5 42.45 44.5Z" fill="#FFFFFF"/>
    </svg>

    <!-- Mail -->
    <svg id="svg-mail" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="64" height="64" rx="14" fill="url(#mail-bg)"/>
      <rect x="14" y="20" width="36" height="24" rx="3.5" fill="#FFFFFF"/>
      <path d="M14 22L32 33L50 22" stroke="url(#mail-accent)" stroke-width="2.5" stroke-linecap="round"/>
    </svg>

    <!-- Photos -->
    <svg id="svg-photos" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="64" height="64" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
      <g opacity="0.9">
        <!-- Top Petal (Red/Pink) -->
        <path d="M32 12C35.866 12 39 15.134 39 19C39 22.866 35.866 26 32 26C28.134 26 25 22.866 25 19C25 15.134 28.134 12 32 12Z" fill="#FF2D55"/>
        <!-- Right Petal (Orange/Yellow) -->
        <path d="M45 25C48.866 25 52 28.134 52 32C52 35.866 48.866 39 45 39C41.134 39 38 35.866 38 32C38 28.134 41.134 25 45 25Z" fill="#FF9500"/>
        <!-- Bottom Petal (Green/Blue) -->
        <path d="M32 38C35.866 38 39 41.134 39 45C39 48.866 35.866 52 32 52C28.134 52 25 48.866 25 45C25 41.134 28.134 38 32 38Z" fill="#4CD964"/>
        <!-- Left Petal (Purple/Indigo) -->
        <path d="M19 25C22.866 25 26 28.134 26 32C26 35.866 22.866 39 19 39C15.134 39 12 35.866 12 32C12 28.134 15.134 25 19 25Z" fill="#5856D6"/>
        <!-- Diagonals -->
        <path d="M41.2 16.2C44.3 18.5 45 22.9 42.7 26C40.4 29.1 36 29.8 32.9 27.5C29.8 25.2 29.1 20.8 31.4 17.7C33.7 14.6 38.1 13.9 41.2 16.2Z" fill="#FFCC00"/>
        <path d="M42.7 38C45 41.1 44.3 45.5 41.2 47.8C38.1 50.1 33.7 49.4 31.4 46.3C29.1 43.2 29.8 38.8 32.9 36.5C36 34.2 40.4 34.9 42.7 38Z" fill="#5AC8FA"/>
        <path d="M22.8 47.8C19.7 45.5 19 41.1 21.3 38C23.6 34.9 28 34.2 31.1 36.5C34.2 38.8 34.9 43.2 32.6 46.3C30.3 49.4 25.9 50.1 22.8 47.8Z" fill="#007AFF"/>
        <path d="M21.3 26C19 22.9 19.7 18.5 22.8 16.2C25.9 13.9 30.3 14.6 32.6 17.7C34.9 20.8 34.2 25.2 31.1 27.5C28 29.8 23.6 29.1 21.3 26Z" fill="#AF52DE"/>
      </g>
    </svg>

    <!-- Camera -->
    <svg id="svg-camera" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="64" height="64" rx="14" fill="url(#camera-bg)"/>
      <rect x="14" y="24" width="36" height="24" rx="6" fill="#8E8E93"/>
      <path d="M24 24L26.5 19H37.5L40 24H24Z" fill="#8E8E93"/>
      <!-- Lens -->
      <circle cx="32" cy="36" r="10" fill="#2C2C2E" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="32" cy="36" r="6" fill="#1C1C1E"/>
      <circle cx="30" cy="34" r="2" fill="#5AC8FA" opacity="0.7"/>
      <!-- Flash -->
      <circle cx="44" cy="29" r="2.5" fill="#FFCC00"/>
    </svg>

    <!-- Settings -->
    <svg id="svg-settings" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="64" height="64" rx="14" fill="url(#settings-bg)"/>
      <!-- Cogwheel center -->
      <circle cx="32" cy="32" r="8" fill="#F2F2F7"/>
      <!-- Teeth and bodies -->
      <path d="M32 16V20M32 44V48M16 32H20M44 32H48M20.7 20.7L23.5 23.5M40.5 40.5L43.3 43.3M20.7 43.3L23.5 40.5M40.5 20.7L43.3 23.5" stroke="#F2F2F7" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="32" cy="32" r="13" stroke="#F2F2F7" stroke-width="3"/>
      <circle cx="32" cy="32" r="5" fill="#8E8E93"/>
    </svg>

    <!-- Music -->
    <svg id="svg-music" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="64" height="64" rx="14" fill="url(#music-bg)"/>
      <!-- Note stems -->
      <path d="M38 18V38M38 21L24 24V43" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M38 20L24 23.5" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <!-- Note heads -->
      <circle cx="20" cy="43" r="5" fill="#FFFFFF"/>
      <circle cx="34" cy="38" r="5" fill="#FFFFFF"/>
    </svg>

    <!-- Maps -->
    <svg id="svg-maps" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="64" height="64" rx="14" fill="url(#maps-bg)"/>
      <!-- Map lines representation -->
      <path d="M10 20H54M10 44H54M24 10V54M40 10V54" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
      <path d="M10 32C24 32 32 20 32 10C32 20 40 32 54 32C40 32 32 44 32 54C32 44 24 32 10 32Z" fill="url(#maps-routes)" opacity="0.8"/>
      <!-- Pin -->
      <circle cx="32" cy="26" r="5" fill="#FF3B30" stroke="#FFFFFF" stroke-width="1.5"/>
      <path d="M32 31L32 37" stroke="#FF3B30" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- Scripts -->
  <script src="js/tictactoe.js"></script>
</body>
</html>
